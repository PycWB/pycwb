[build-system]
requires = ["setuptools", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "PycWB"
description = "A Python package for coherent gravitational wave burst analysis"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "The PycWB team", email = "yumeng.xu@ligo.org"},
]
keywords = ["ligo", "physics", "gravity", "signal processing", "gravitational waves", "cwb", "coherent wave burst"]
requires-python = ">=3.11"
dynamic = ["version"]

dependencies = [
    "matplotlib",
    "astropy",
    "pyyaml",
    "jsonschema",
    "watchfiles",
    "numba",
    "jax",
    "gwpy",
    "ligo-segments",
    "ligo-gracedb",
    "aiohttp",
    "filelock",
    "numpy>=2",
    "scipy>=1.13",
    "h5py>=3.11",
    "lalsuite>=7.23",
    "healpy>=1.17",
    "scikit-learn>=1.4.2",
    "joblib>=1.3",
    "pyarrow>=17",
    "pillow>=9.0.0",
    "click",
    "orjson",
    "dacite",
    "cartopy",
    "htcondor",
    "psutil",
    "memspectrum",
    "python-ligo-lw<2.0.0",
    "jinja2",
    "plotly",
    "wdm-wavelet>=0.4.0",
    "burst-waveform>=0.5.0",
    "pandas",
    "duckdb",
    "tqdm",
    "iminuit"
]

[project.optional-dependencies]
pycbc = ["pycbc"]
# nds2-client and python-nds2-client are not on PyPI; install via conda-forge.
# gwpy (a hard dependency) will use them automatically when present.
nds2 = ["python-nds2-client"]
xgboost = ["xgboost"]
test = ["pytest>=7", "pytest-mock", "pytest-cov", "iminuit", "xgboost"]

[project.urls]
Homepage = "https://git.ligo.org/yumeng.xu/pycwb"
Documentation = "https://pycwb.readthedocs.io"
Issues = "https://git.ligo.org/yumeng.xu/pycwb/-/issues"
Changelog = "https://git.ligo.org/yumeng.xu/pycwb/-/blob/main/CHANGES.md"

[tool.setuptools_scm]
write_to = "pycwb/_version.py"

[tool.setuptools]
include-package-data = true
script-files = ["bin/pycwb"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
force-exclude = true
extend-exclude = ["**/tests/**", "**/vendor/**", "_version.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["pycwb/config/execution.py", "pycwb/config/processing.py", "pycwb/constants/gpu_options.py", "pycwb/config/validation.py", "pycwb/modules/coherence_native/callbacks.py", "pycwb/modules/super_cluster_native/callbacks.py", "pycwb/modules/likelihoodWP/callbacks.py", "pycwb/utils/size.py", "pycwb/utils/intervals.py", "pycwb/cli/validate.py", "pycwb/modules/coherence_gpu/coherence.py", "pycwb/modules/likelihood_gpu/likelihood.py", "pycwb/modules/super_cluster_gpu/super_cluster.py"]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
