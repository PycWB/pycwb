<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" role="img" aria-labelledby="title desc">
<title id="title">Lags and superlags</title>
<desc id="desc">Animated illustration. (a) Lags: inside one job segment the first detector is read at t plus m times lagStep with circular wrap-around while the others stay fixed; only lag 0 keeps a real signal coincident. (b) Superlags: detector k reads data from s_k times segLen earlier, pairing different segments without wrap-around; unpaired segments are not analysed.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/></marker>
<clipPath id="clipB"><rect x="12" y="342" width="676" height="110"/></clipPath>
<clipPath id="clipA"><rect x="118" y="95" width="528" height="36"/></clipPath>
<style>
text { font-family: Helvetica, Arial, sans-serif; }
@keyframes lagshift { 0.0% {transform:translateX(0.0px)} 21.0% {transform:translateX(0.0px)} 29.0% {transform:translateX(-66.0px)} 46.0% {transform:translateX(-66.0px)} 54.0% {transform:translateX(-132.0px)} 71.0% {transform:translateX(-132.0px)} 79.0% {transform:translateX(-198.0px)} 96.0% {transform:translateX(-198.0px)} 100% {transform:translateX(0px)} }
@keyframes slagshift { 0.0% {transform:translateX(0.0px)} 29.3% {transform:translateX(0.0px)} 37.3% {transform:translateX(100.0px)} 62.7% {transform:translateX(100.0px)} 70.7% {transform:translateX(200.0px)} 96.0% {transform:translateX(200.0px)} 100% {transform:translateX(0px)} }
@keyframes showA { 0% {opacity:1} 23.0% {opacity:1} 25.0% {opacity:0} 98.5% {opacity:0} 100% {opacity:1} }
@keyframes showB { 0% {opacity:1} 31.3% {opacity:1} 33.3% {opacity:0} 98.5% {opacity:0} 100% {opacity:1} }
@keyframes coinc { 0% {stroke:#2e7d32;opacity:1} 23% {stroke:#2e7d32;opacity:1} 25% {stroke:#90a4ae;opacity:0.6} 98.5% {stroke:#90a4ae;opacity:0.6} 100% {stroke:#2e7d32;opacity:1} }
@keyframes nopair1 { 0% {opacity:0} 31.3% {opacity:0} 35.3% {opacity:0.7} 98% {opacity:0.7} 100% {opacity:0} }
@keyframes nopair2 { 0% {opacity:0} 64.7% {opacity:0} 68.7% {opacity:0.7} 98% {opacity:0.7} 100% {opacity:0} }
.h1lag { animation: lagshift 12s ease-in-out infinite; }
.l1slag { animation: slagshift 12s ease-in-out infinite; }
.capA { animation: showA 12s linear infinite; }
.capB { animation: showB 12s linear infinite; }
.coinc { animation: coinc 12s linear infinite; }
.nopair1 { animation: nopair1 12s linear infinite; }
.nopair2 { animation: nopair2 12s linear infinite; }
@media (prefers-reduced-motion: reduce) { .h1lag, .l1slag, .capA, .capB, .coinc, .nopair1, .nopair2 { animation: none; } }
</style>
