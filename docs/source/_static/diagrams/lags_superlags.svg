<g class="capA" style="animation-delay:-9.00s" opacity="0"><text x="118" y="234" font-size="13" fill="#263238" font-weight="bold" text-anchor="start">lag 1: H1 read at t + 1 × lagStep</text><text x="118" y="252" font-size="12" fill="#546e7a" font-weight="normal" text-anchor="start">the signal no longer lines up: background</text></g>
<g class="capA" style="animation-delay:-6.00s" opacity="0"><text x="118" y="234" font-size="13" fill="#263238" font-weight="bold" text-anchor="start">lag 2: H1 read at t + 2 × lagStep</text><text x="118" y="252" font-size="12" fill="#546e7a" font-weight="normal" text-anchor="start">coincidences are accidental: background</text></g>
