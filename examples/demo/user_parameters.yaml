# Synthetic injection example, run with the ordinary PycWB CLI.
# Educational settings, not a production sensitivity or significance measurement.

# --- Analysis and detector network ---
analysis: 2G
cfg_search: r
ifo: [L1, H1]
refIFO: L1
nproc: 1

# --- Sampling and frequency band ---
inRate: 2048
levelR: 1
fLow: 32.0
fHigh: 480.0

# --- Wavelet resolutions and whitening ---
l_low: 4
l_high: 7
l_white: 0
whiteWindow: 60.0
whiteStride: 20.0

# --- Segment length and boundaries ---
segLen: 128
segMLS: 32
segTHR: 0
segEdge: 8

# --- Time shifts: one zero-lag analysis ---
lagSize: 1
lagOff: 0
lagMax: 0
slagSize: 1

# --- Sky grid and cross-talk catalog ---
healpix: 4
filter_dir: .
wdmXTalk: wdmXTalk/OverlapCatalog16-1024.bin

# --- Pixel selection and clustering ---
pattern: 10
Acore: 1.7
Tgap: 0.2
Fgap: 128.0

# --- Network thresholds and regularization ---
subnet: 0.5
subcut: -1.0
netRHO: 4.0
netCC: 0.5
cfg_gamma: -1.0

# --- Output products ---
plot_trigger: false
save_waveform: true
plot_waveform: true
save_injection: true
plot_injection: false
save_sky_map: false
plot_sky_map: false

# --- Injection mode and time window ---
simulation: all_inject_in_one_segment
nfactor: 1
iwindow: 2.0

# --- Seeded noise and synthetic burst ---
injection:
  generator: burst_waveform.interface.generate_waveform_pycwb.get_td_waveform

  # GPS interval and reproducible noise seeds, in the order listed in ifo.
  segment:
    start: 1126259462
    end: 1126259590
    noise:
      seeds: [150914, 150915]

  parameters:
    # Waveform shape and amplitude.
    approximant: SGE
    frequency: 150.0
    Q: 9.0
    hrss: 1.0e-21
    iota: 0.0

    # Arrival time and sky position; angles are in radians.
    gps_time: 1126259526
    ra: 1.0
    dec: 0.3
    pol: 0.8

    # Waveform time support, in seconds relative to the injection epoch.
    t_start: -0.5
    t_end: 0.5
